[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "dydownload"
version = "1.0.0"
description = "Windows 抖音 / B 站视频与图集下载工具"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "beautifulsoup4>=4.12",
    "hishel>=0.0.30",
    "py_mini_racer>=0.6.0",
]

[project.scripts]
dydownload = "dydownload.cli:app"
dydownload-gui = "dydownload.gui:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
dydownload = ["js/*.js"]
